name: News Site (GitHub Pages)

# Fetches news from Finnhub, groups duplicates and publishes the static news page.
# No OpenAI calls here; the AI report stays in marketagent-cron.yml (once a day).

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes (GitHub may delay scheduled runs under load)

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install finnhub-python python-dotenv

      - name: Build site
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python -m engine.build_news_site --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
