name: Run MarketAgent After-Market Daily

on:
  workflow_dispatch:
    inputs:
      market_session:
        description: 'Market session (pre-market or after-market)'
        required: false
        default: 'after-market'
  schedule:
    - cron: "30 21 * * *"  # 21:30 UTC = 22:30 Skopje (CET/Winter) - After-Market

permissions:
  contents: write   # push the report to the data branch
  actions: write    # trigger a news-site rebuild

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set market session
        run: echo "MARKET_SESSION=${{ inputs.market_session || 'after-market' }}" >> $GITHUB_ENV

      - name: Run full pipeline
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_DAILY_REPORTS: ${{ secrets.TELEGRAM_TOPIC_DAILY_REPORTS }}
          TELEGRAM_TOPIC_MARKET_NEWS: ${{ secrets.TELEGRAM_TOPIC_MARKET_NEWS }}
          TELEGRAM_TOPIC_COMPANY_INFO: ${{ secrets.TELEGRAM_TOPIC_COMPANY_INFO }}
          TELEGRAM_TOPIC_EARNINGS: ${{ secrets.TELEGRAM_TOPIC_EARNINGS }}
          MARKET_SESSION: ${{ env.MARKET_SESSION }}
        run: python run_full_pipeline.py

      # The steps below also run when the pipeline reported a failure (e.g. Telegram
      # was down): a report that was generated is still worth saving.
      - name: Check out data branch
        if: ${{ !cancelled() }}
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-store

      - name: Save report to data branch
        if: ${{ !cancelled() }}
        run: |
          python -m engine.report_store --data-dir data-store
          cd data-store
          git add -A
          if git diff --cached --quiet; then
            echo "No new report to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "report: $(date -u +%F) ${MARKET_SESSION}"
          git push

      - name: Refresh news site
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-pages.yml --ref "${{ github.ref_name }}"
