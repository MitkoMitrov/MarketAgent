name: Run MarketAgent Twice Daily

on:
  workflow_dispatch:
    inputs:
      market_session:
        description: 'Market session (pre-market or after-market)'
        required: false
        default: 'after-market'
  schedule:
    - cron: "10 22 * * *"  # 22:00 UTC = 23:00 Skopje (11:00 PM CET/Winter)

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine market session
        id: session
        run: |
          if [ "${{ github.event.schedule }}" = "10 22 * * *" ] || [ "${{ github.event.inputs.market_session }}" = "pre-market" ]; then
            echo "MARKET_SESSION=pre-market" >> $GITHUB_ENV
          else
            echo "MARKET_SESSION=after-market" >> $GITHUB_ENV
          fi

      - name: Run full pipeline
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_DAILY_REPORTS: ${{ secrets.TELEGRAM_TOPIC_DAILY_REPORTS }}
          TELEGRAM_TOPIC_MARKET_NEWS: ${{ secrets.TELEGRAM_TOPIC_MARKET_NEWS }}
          TELEGRAM_TOPIC_COMPANY_INFO: ${{ secrets.TELEGRAM_TOPIC_COMPANY_INFO }}
          TELEGRAM_TOPIC_EARNINGS: ${{ secrets.TELEGRAM_TOPIC_EARNINGS }}
          MARKET_SESSION: ${{ env.MARKET_SESSION }}
        run: python run_full_pipeline.py
