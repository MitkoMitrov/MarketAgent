name: Tests

on:
  push:
    branches: [main]
    paths: ["**.py", "web/**", ".github/workflows/tests.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install finnhub-python python-dotenv requests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -t . -v
